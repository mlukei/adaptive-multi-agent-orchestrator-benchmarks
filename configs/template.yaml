# Template benchmark config

# Copy this file into configs/officebench/... or configs/gaia/... and edit the
# paths/flags for the experiment you want to run.

# ----- LLM ----------------------------------------------------
llm:
  # Fallback deployment name used by --model-name defaults.
  model_name: "gpt-5.4-mini"
  temperature: 0.0

  # Model used by the top-level orchestrator.
  orchestrator:
    model_name: "gpt-5.4-mini"
    temperature: 0.0

  # Model used by benchmark sub-agents.
  agents:
    model_name: "gpt-5.4-mini"
    temperature: 0.0

  # Model used for agent-level and episode-level curation.
  curator:
    model_name: "gpt-5.1"
    temperature: 0.0

  # Optional model used by the final judge gate.
  judge:
    model_name: "gpt-5.1"
    temperature: 0.0

  # Embedding deployment used for retrieval and memory.
  embedder:
    model_name: "text-embedding-ada-002"

  azure:
    endpoint: "${AZURE_OPENAI_ENDPOINT}"
    api_key: "${AZURE_OPENAI_API_KEY}"
    api_version: "${AZURE_OPENAI_API_VERSION}"
    deployment: "${AZURE_OPENAI_DEPLOYMENT}"

  request_timeout: 120

  # Per-million token prices used for CSV cost calculations
  pricing:
    gpt-5.4-nano: { input: 0.20, output: 1.25 }
    gpt-5.4-mini: { input: 0.75, output: 4.8 }
    gpt-4o-mini:  { input: 0.15, output: 0.60 }
    gpt-4o:       { input: 2.50, output: 10.00 }
    gpt-5.1:      { input: 1.25, output: 10.00 }
    default:      { input: 2.50, output: 10.00 }
    text-embedding-ada-002: { input: 0.10 }

# ----- Orchestrator ------------------------------------------
orchestrator:
  # Result CSV path is results/{variant}.csv.
  # Memory schema defaults to variant with "/" replaced by "_".
  variant: "template/example_run"

  # train = write memory/ test = read-only memory.
  memory_mode: "train"

  # Optional: read memory from a different schema than this run's variant.
  # E.g. if during testing you want to read from a previous training run's memory, set this to that run's variant.
  # memory_schema: "template/training_run"

  db:
    conninfo: "postgresql://orchestrator:orchestrator@localhost:5433/orchestrator"

  # Optional flags to enable/disable features.
  enable_playbooks: true
  enable_blueprints: true
  enable_subagent_memory: false
  enable_agent_filtering: true
  enable_judge: true
  profile_agents: true

  # Choose rich or sparse card folders to define the condition.
  agent_cards_path: "agents/officebench/sparse/cards.json"
  noise_agents_path: "agents/officebench/sparse/noise.json"
  noise_model_name: "gpt-5.4-nano"
  noise_temperature: 0.7

# ----- Dynamic Pool ------------------------------------------
  # Optional path to extra agent cards to include in the pool
  # extra_agent_cards_path: "agents/officebench/sparse/extra.json"

  # Optional capability perturbations.
  # OfficeBench: disabled_actions removes app actions from the sub-agent prompt
  # and blocks them at tool execution time (app/agent -> list of action names).
  # disabled_actions:
  #   excel:
  #     - convert_to_pdf
  #   pdf:
  #     - convert_to_word
  #     - convert_to_image


  # GAIA: disabled_tools removes tools from the agent's tool list entirely
  # (agent -> list of tool names), so the removal is enforced.
  # disabled_tools:
  #   file_surfer: ["transcribe_audio"]

  # Optional Precomputed profiled capability bullets. Set to null to profile at runtime.
  # profiled_bullets_path: "agents/officebench/sparse/profiled.json"

# ----- Docker ------------------------------------------------
# Used by OfficeBench. GAIA ignores these fields.
docker:
  image_name: "officebench"
  container_name: "ob-template"
  dockerfile_path: "./docker/Dockerfile"

# ----- Execution ---------------------------------------------
execution:
  # Use "tasks/officebench" for OfficeBench, "tasks/gaia" for GAIA.
  tasks_root: "tasks/officebench"

  # "default" skips existing task outputs; "force_new" reruns.
  mode: "force_new"

  task_timeout_seconds: 900
  timeout_retries: 1
  retry_backoff_seconds: 5

  task_split:
    name: "train"          # all | train | test
    train_fraction: 0.4
    test_fraction: 0.6
    seed: 42
