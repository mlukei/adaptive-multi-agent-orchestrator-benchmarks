[project]
name = "orch-bench"
version = "0.1.0"
description = "Orch-Bench - A dual benchmark suite for evaluating the performance of orchestrators on OfficeBench and GAIA benchmarks."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

dependencies = [
    # Core
    "fire==0.5.0",
    "pandas>=2.1,<3",
    "scikit-learn>=1.5,<2",
    "orchestrator",
    "matplotlib",
    # Document processing (OfficeBench apps + GAIA file tools)
    "python-docx==1.1.0",
    "python-pptx>=1.0",
    "pillow",
    "pymupdf>=1.27.2,<1.27.2.2",
    "pypdf2",
    "pdf2docx",
    "pytesseract",
    "openpyxl",
    "icalendar",
    # LLM & GAIA tools
    "openai",
    "ddgs>=7.0",
    "openai-whisper>=20231117",
    "httpx>=0.28",
    # LangChain ecosystem
    "langchain>=0.2,<2.0",
    "langchain-core>=1.0",
    "langchain-openai>=0.2,<2.0",
    "langgraph>=1.0",
    # A2A agent cards
    "a2a-sdk>=0.3.22",
    # Infrastructure & utilities
    "docker",
    "pyyaml",
    "python-dotenv>=1.0",
    "pytz",
    # Required by the vendored InterCode envs (intercode/envs/*)
    "gymnasium",
    "mysql-connector-python",
    "rpyc",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "benchmarks", "intercode", "logger", "runtime"]

[tool.uv]

[dependency-groups]
dev = []


[tool.uv.sources]
orchestrator = { git = "https://github.com/marleenlki/adaptive-agent-orchestrator.git", rev = "c4861015dbe47d10f25157915e0daf8bba4f59c5" }
